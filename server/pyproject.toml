[project]
name = "svelte-supabase-stripe-server"
version = "0.1.0"
description = "Bare-bones FastAPI backend for Supabase auth, MongoDB, and Stripe subscriptions"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "pymongo>=4.19.0",
  "python-dotenv>=1.2.4",
  "stripe>=16.1.0",
  "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=9.2.0",
]

[tool.uv]
package = false
