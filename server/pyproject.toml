[project]
name = "svelte-supabase-stripe-server"
version = "0.1.0"
description = "Bare-bones FastAPI backend for Supabase auth, MongoDB, and Stripe subscriptions"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pymongo",
  "python-dotenv",
  "stripe",
  "pyjwt[crypto]>=2.12.1",
]

[dependency-groups]
dev = [
  "httpx",
  "pytest",
]

[tool.uv]
package = false
